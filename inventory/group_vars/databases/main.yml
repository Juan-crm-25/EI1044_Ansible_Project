---
# inventory/group_vars/databases/main.yml  (BORRADOR)
# Valores de proyecto para el grupo "databases" (db01). Tienen prioridad sobre
# los valores por defecto de roles/database/defaults/main.yml.
# El resto de variables database_* (paquetes, codificación...) se dejan en los defaults.

# Base de datos y usuario de la aplicación.
database_name: app
database_user: appuser

# Tabla de ejemplo (restore.yml verifica sus 3 filas).
database_table: clientes

# database_password: no se define aquí. Irá cifrada en group_vars/all/vault.yml.
