---
# Variables compartidas por todos los roles.
# Los valores están en database_*; las db_* son los nombres con los que
# las usan el resto de roles (web, backup...).
database_host: db01
database_port: 5432
database_name: app
database_user: app

db_host: "{{ database_host }}"
db_port: "{{ database_port }}"
db_name: "{{ database_name }}"
db_user: "{{ database_user }}"
db_password: "{{ database_password }}"
