[defaults]
# Inventario y roles del proyecto (evita pasar -i en cada comando).
inventory = inventory/hosts.yml
roles_path = roles

# Usuario con el que Ansible entra por SSH a los contenedores.
remote_user = ansible

# Solo para el laboratorio: los contenedores se recrean y cambian de clave de host.
host_key_checking = False

# Detecta el Python de las máquinas destino sin mostrar avisos.
interpreter_python = auto_silent

# Resultados en formato YAML, más legibles al depurar.
callback_result_format = yaml
vault_password_file = .vault_pass

[ssh_connection]
# Menos conexiones SSH por tarea: ejecuciones más rápidas.
pipelining = True
# Reutiliza la conexión 60 s y no guarda claves de host del laboratorio en known_hosts.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
