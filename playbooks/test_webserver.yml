---
# Prueba del rol webserver con su dependencia real: primero el rol database
# en db01 (con los datos de ejemplo) y después el rol webserver en web01.
# Las contraseñas vienen del Vault.
#
#   ansible-playbook playbooks/test_webserver.yml

- name: Preparar la base de datos en db01
  hosts: databases
  become: true

  vars:
    # clientes.php necesita filas que mostrar; el rol no las carga por defecto
    database_load_sample_data: true

  roles:
    - database

- name: Probar el rol webserver
  hosts: webservers
  become: true

  roles:
    - webserver
