---
# Recuperación ante desastres: restaura los datos desde la copia de seguridad y
# verifica que todo funciona. Antes hay que reconstruir las máquinas con
# site.yml (mientras no exista, playbooks/test_backup.yml para db01).
#
#   ansible-playbook playbooks/restore.yml -e backup_restore_confirmar=true
#   ansible-playbook playbooks/restore.yml -e backup_restore_confirmar=true -e backup_restore_snapshot=<id>

- name: Restaurar la base de datos desde la copia de seguridad
  hosts: databases
  become: true
  gather_facts: false

  tasks:
    - name: Restaurar los datos desde restic
      ansible.builtin.include_role:
        name: backup
        tasks_from: restore

- name: Verificar la base de datos restaurada
  hosts: databases
  become: true
  gather_facts: false

  tasks:
    - name: Leer los clientes de la base de datos restaurada
      community.postgresql.postgresql_query:
        login_db: "{{ database_name }}"
        query: "SELECT nombre FROM {{ database_table }} ORDER BY id"
      become: true
      become_user: postgres
      register: database_restore_clientes
      changed_when: false

    - name: Verificar que están los datos de ejemplo
      ansible.builtin.assert:
        that: database_restore_clientes.query_result | map(attribute='nombre') | list == ['Ana', 'Luis', 'Marta']
        success_msg: "{{ inventory_hostname }}: la base de datos {{ database_name }} se ha restaurado con los 3 clientes de ejemplo"
        fail_msg: "Los datos restaurados no son los esperados: {{ database_restore_clientes.query_result }}"

