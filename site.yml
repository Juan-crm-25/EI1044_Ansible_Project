---
# Despliegue completo. Los roles que aún no existen están comentados:
# descoméntalos según entren en main. Orden: base, BD, web, copias.
- name: Configuración base de todas las máquinas
  hosts: all
  become: true
  roles:
    - common

- name: Base de datos
  hosts: databases
  become: true
  roles:
    - database

- name: Servidor web
  hosts: webservers
  become: true
  roles:
    - webserver

# El rol backup se aplica a db01; él mismo prepara también backup01.
- name: Copias de seguridad
  hosts: databases
  become: true
  roles:
    - backup
