---
# Nombre del sitio: para el fichero de configuración de nginx
webserver_site_name: proyecto

# Puerto en el que escucha nginx dentro de web01
webserver_port: 80

# Carpeta de ficheros de la web
webserver_root: "/var/www/{{ webserver_site_name }}"

# Titulo de la página
webserver_title: "Proyecto Ansible - EI1044"

# Versión de PHP de la distribución
webserver_php_version: "8.1"

# Socket por el que nginx le pasa las peticiones .php a PHP-FPM
webserver_php_fpm_socket: "/run/php/php{{ webserver_php_version }}-fpm.sock"
