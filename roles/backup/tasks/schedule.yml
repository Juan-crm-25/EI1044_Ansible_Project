---
- name: Instalar el servicio de copia
  ansible.builtin.template:
    src: backup.service.j2
    dest: /etc/systemd/system/backup-db.service
    mode: "0644"
  register: backup_unidad_servicio

- name: Instalar el temporizador de copia
  ansible.builtin.template:
    src: backup.timer.j2
    dest: /etc/systemd/system/backup-db.timer
    mode: "0644"
  register: backup_unidad_timer

- name: Activar el temporizador de copia diaria
  ansible.builtin.systemd_service:
    name: backup-db.timer
    enabled: true
    state: started
    daemon_reload: "{{ backup_unidad_servicio.changed or backup_unidad_timer.changed }}"
