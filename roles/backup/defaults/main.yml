---
# --- Repositorio restic (en backup01) ---
backup_repo_host: backup01
backup_repo_user: restic
backup_repo_path: /srv/restic
backup_repo_url: "sftp:{{ backup_repo_user }}@{{ backup_repo_host }}:{{ backup_repo_path }}"

# Contraseña del repositorio: OBLIGATORIA y secreta (irá en Ansible Vault).
# No tiene valor por defecto a propósito: si falta, el rol falla.
# PENDIENTE (Vault): definir backup_restic_password cifrada en
#   inventory/group_vars/all/vault.yml (db01 debe poder verla) y añadirla a
#   vault.yml.example. Guardar también una copia de la contraseña FUERA del
#   repo: si se pierde, todas las copias de seguridad son irrecuperables.
# backup_restic_password:

# --- Versión de restic (binario oficial) ---
backup_restic_version: "0.19.1"
backup_restic_bin: /usr/local/bin/restic
# Traducción del fact ansible_architecture al nombre que usa restic en sus descargas
backup_restic_arch_map:
  x86_64: amd64
  aarch64: arm64

# --- Base de datos a copiar ---
# Apunta a la base de datos del rol database.
backup_db_name: "{{ database_name }}"

# --- Script de copia (lo usan la tarea que lo instala y el servicio de systemd) ---
backup_script: /usr/local/sbin/backup-db.sh

# --- Retención ---
backup_keep_daily: 7
backup_keep_weekly: 4
backup_keep_monthly: 6

# --- Restauración (tasks/restore.yml, la usa playbooks/restore.yml) ---
# Copia a restaurar: "latest" (la más reciente) o el identificador de un snapshot.
backup_restore_snapshot: latest
# Restaurar sobrescribe la base de datos: hay que confirmarlo con
# -e backup_restore_confirmar=true
backup_restore_confirmar: false

# --- Programación (formato OnCalendar de systemd): todos los días a las 03:00 ---
# La zona horaria al final hace que sean las 03:00 españolas aunque la máquina
# esté en UTC (systemd aplica solo el cambio de hora de verano/invierno).
backup_schedule: "*-*-* 03:00:00 Europe/Madrid"
